fields:
  id:
    column: ID
    type: integer
    nullable: true
    include: false

  operation:
    column: Operation
    type: string
    default: CREATE
    options:
      - CREATE
      - UPDATE
      - PATCH
      - DELETE
    include: false

  patient_name:
    column: Patient Name
    type: string
    required: true
    min_length: 3
    max_length: 100
    transform: [strip]

  date_of_birth:
    column: DOB
    type: date
    required: true

  phone:
    column: Phone
    type: phone
    required: true

  policy_number:
    column: Policy Number
    type: string

  department:
    column: Department
    type: string
    options:
      - Cardiology
      - Orthopedics
      - General Medicine
      - Neurology

  amount:
    column: Amount
    type: decimal
    required: true
    min: 0
